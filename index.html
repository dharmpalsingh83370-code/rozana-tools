<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="0gVLu9IBUvchmsz1piHSIJShxAIIYFTO38y4iMessU0" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozana Tools – Free EMI, Calculator, Notes, Mausam aur Bahut Kuch</title>
<meta name="description" content="Free online tools: EMI calculator, umar calculator, word counter, calculator, notes, mausam, calendar, music aur video player. Hindi/Hinglish mein, mobile friendly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧮%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12283a;--mute:#5b7183;--line:#d3dee6;--acc:#e8890c;--accink:#fff;--ok:#1b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c27;--card:#172a38;--ink:#e8f0f5;--mute:#93a9b8;--line:#2a4254;--acc:#f5a63a;--accink:#1a1200;--ok:#5fd59a}}
:root[data-theme="dark"]{--bg:#0f1c27;--card:#172a38;--ink:#e8f0f5;--mute:#93a9b8;--line:#2a4254;--acc:#f5a63a;--accink:#1a1200;--ok:#5fd59a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Hind,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px;font-weight:700}
#snd{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:20px;padding:6px 10px;cursor:pointer}
.sub{color:var(--mute);margin:0 0 20px}
nav{display:flex;gap:6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px}
nav button{flex:none;border:0;background:none;color:var(--mute);font:600 15px Hind,sans-serif;padding:10px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--acc);color:var(--accink)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
section[hidden]{display:none}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;font:400 17px Hind,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
button.go{margin-top:12px;width:100%;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font:700 17px Hind,sans-serif;padding:12px;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.out{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.big{font-size:34px;font-weight:700;color:var(--ok);line-height:1.2}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--mute)}
.row b{color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.keys button{padding:14px 0;font:600 20px Hind,sans-serif;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.keys .op{background:var(--acc);color:var(--accink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{color:var(--mute);font-size:13px}
.cal button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 0;font:inherit;cursor:pointer}
.cal .today{outline:2px solid var(--acc)}
.cal .has{background:var(--acc);color:var(--accink)}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.cn button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:18px;cursor:pointer}
.it{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;margin-top:6px;font:inherit;cursor:pointer}
.it.on{border-color:var(--acc)}
footer{margin-top:24px;color:var(--mute);font-size:14px;text-align:center}
</style>
</head>
<body>
<main>
<div class="top"><h1>Rozana Tools</h1><button id="snd" aria-label="Sound on ya off">🔊</button></div>
<p class="sub" id="hi"></p>
<nav id="nav" role="tablist"></nav>

<section id="emi">
<label for="p">Loan amount (₹)</label><input id="p" type="number" inputmode="decimal" value="500000">
<label for="r">Byaaj dar (% saalana)</label><input id="r" type="number" inputmode="decimal" value="10">
<label for="y">Samay (saal)</label><input id="y" type="number" inputmode="decimal" value="5">
<button class="go" id="emiGo">EMI nikaalo</button>
<div class="out" id="emiOut" aria-live="polite"></div>
</section>

<section id="age" hidden>
<label for="dob">Janm tithi</label><input id="dob" type="date">
<button class="go" id="ageGo">Umar nikaalo</button>
<div class="out" id="ageOut" aria-live="polite"></div>
</section>

<section id="words" hidden>
<label for="txt">Apna text yahan likho ya paste karo</label>
<textarea id="txt"></textarea>
<div class="out">
<div class="row">Shabd<b id="w">0</b></div>
<div class="row">Akshar (spaces ke saath)<b id="c">0</b></div>
<div class="row">Akshar (spaces ke bina)<b id="cs">0</b></div>
<div class="row">Vaakya<b id="s">0</b></div>
</div>
</section>

<section id="calc" hidden>
<input id="cd" readonly value="0" style="font-size:28px;text-align:right" aria-label="Calculator screen">
<div class="keys">
<button data-k="C" class="op">C</button><button data-k="(">(</button><button data-k=")">)</button><button data-k="/" class="op">÷</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">×</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">−</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
<button data-k="0">0</button><button data-k=".">.</button><button data-k="B">⌫</button><button data-k="=" class="op">=</button>
</div>
</section>

<section id="notes" hidden>
<label for="nt">Meri Notes (is phone mein save hoti hain)</label>
<textarea id="nt"></textarea>
<button class="go" id="pdf">PDF banao</button>
<button class="go" id="ntClr" style="background:var(--line);color:var(--ink)">Saaf karo</button>
<div class="out">PDF ke liye print screen mein "Save as PDF" chuno.</div>
</section>

<section id="wx" hidden>
<label for="city">Shehar ka naam</label><input id="city" placeholder="Jaise Delhi, Jaipur">
<button class="go" id="wxGo">Mausam dekho</button>
<div class="out" id="wxOut" aria-live="polite"></div>
</section>

<section id="cal" hidden>
<div class="cn"><button id="prev" aria-label="Pichhla mahina">‹</button><span id="cTitle"></span><button id="next" aria-label="Agla mahina">›</button></div>
<div class="cal" id="grid"></div>
<div id="evBox" hidden class="out">
<label for="evTxt" id="evLbl"></label><input id="evTxt" placeholder="Kaam ya yaad likho">
<button class="go" id="evSave">Save karo</button>
</div>
</section>

<section id="mus" hidden>
<label for="mf">Phone se gaane chuno</label><input id="mf" type="file" accept="audio/*" multiple>
<audio id="aud" controls style="width:100%;margin-top:12px"></audio>
<div id="nowp" class="sub"></div>
<div id="pl"></div>
</section>

<section id="vid" hidden>
<label for="vf">Phone se video chuno</label><input id="vf" type="file" accept="video/*">
<label for="yu">Ya YouTube ka link paste karo</label><input id="yu" placeholder="https://youtu.be/...">
<button class="go" id="yt">YouTube chalao</button>
<div id="vbox" style="margin-top:14px"></div>
</section>

<section id="me" hidden>
<label for="nm">Apna naam</label><input id="nm" placeholder="Naam likho">
<button class="go" id="nmSave">Save karo</button>
<div class="out">Naam sirf is phone mein save hota hai.</div>
</section>

<footer>Rozana Tools · Aapka data aapke phone se bahar nahi jata</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const inr=n=>'₹ '+Math.round(n).toLocaleString('en-IN');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let soundOn=true,ac;
function beep(f,d){
  if(!soundOn)return;d=d||0.09;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.12,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
const ding=()=>{beep(660);setTimeout(()=>beep(880,0.14),100)};
const oops=()=>beep(200,0.18);
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇';beep(800)};

const T=[['emi','EMI'],['age','Umar'],['words','Shabd'],['calc','Calc'],['notes','Notes'],['wx','Mausam'],['cal','Calendar'],['mus','Music'],['vid','Video'],['me','Profile']];
const navEl=$('nav');
T.forEach(([id,n],i)=>{
  const b=document.createElement('button');
  b.textContent=n;b.setAttribute('role','tab');b.setAttribute('aria-selected',i==0);
  b.onclick=()=>{beep(520);[...navEl.children].forEach(x=>x.setAttribute('aria-selected',x===b));T.forEach(([s])=>$(s).hidden=s!==id)};
  navEl.appendChild(b);
});

function greet(){const n=ls.get('name','');$('hi').textContent=n?'Namaste, '+n+'! Free tools jo roz kaam aate hain.':'Free tools jo roz kaam aate hain. Koi login nahi chahiye.'}
$('nm').value=ls.get('name','');
$('nmSave').onclick=()=>{ls.set('name',$('nm').value.trim());greet();ding()};
greet();

$('emiGo').onclick=()=>{
  const P=+$('p').value,r=+$('r').value/1200,n=+$('y').value*12;
  if(!(P>0&&n>0&&r>=0)){oops();$('emiOut').textContent='Sahi amount, byaaj aur saal daalo.';return}
  const e=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1),t=e*n;
  $('emiOut').innerHTML='<div>Mahine ki EMI</div><div class="big">'+inr(e)+'</div><div class="row">Kul byaaj<b>'+inr(t-P)+'</b></div><div class="row">Kul bhugtaan<b>'+inr(t)+'</b></div>';
  ding();
};
$('ageGo').onclick=()=>{
  const v=$('dob').value;
  if(!v){oops();$('ageOut').textContent='Pehle janm tithi chuno.';return}
  const d=new Date(v),t=new Date();
  if(d>t){oops();$('ageOut').textContent='Janm tithi aaj se pehle ki honi chahiye.';return}
  let y=t.getFullYear()-d.getFullYear(),m=t.getMonth()-d.getMonth(),dd=t.getDate()-d.getDate();
  if(dd<0){m--;dd+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  $('ageOut').innerHTML='<div class="big">'+y+' saal, '+m+' mahine, '+dd+' din</div><div class="row">Kul din<b>'+Math.floor((t-d)/864e5).toLocaleString('en-IN')+'</b></div>';
  ding();
};
$('txt').oninput=e=>{
  const s=e.target.value;
  $('w').textContent=(s.trim().match(/\S+/g)||[]).length;
  $('c').textContent=s.length;
  $('cs').textContent=s.replace(/\s/g,'').length;
  $('s').textContent=(s.match(/[^.!?।]+[.!?।]+/g)||[]).length;
};

let ex='';const disp=$('cd');
document.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;beep(600,0.05);
  if(k==='C')ex='';
  else if(k==='B')ex=ex.slice(0,-1);
  else if(k==='='){
    try{
      if(!/^[0-9+\-*/.() ]+$/.test(ex))throw 0;
      const r=Function('"use strict";return ('+ex+')')();
      if(!isFinite(r))throw 0;
      ex=String(+r.toFixed(8));ding();
    }catch(e){oops();ex='';disp.value='Galat';return}
  }else ex+=k;
  disp.value=ex||'0';
});

const note=$('nt');note.value=ls.get('notes','');
note.oninput=()=>ls.set('notes',note.value);
$('ntClr').onclick=()=>{note.value='';ls.set('notes','')};
$('pdf').onclick=()=>{
  const w=window.open('','_blank');
  if(!w){oops();return}
  w.document.write('<title>Meri Notes</title><pre style="font:17px sans-serif;white-space:pre-wrap">'+esc(note.value)+'</pre>');
  w.document.close();w.print();ding();
};

const wc=c=>c===0?'Saaf aasmaan ☀️':c<4?'Halke baadal ⛅':c<50?'Kohra 🌫️':c<70?'Baarish 🌧️':c<80?'Barf ❄️':c<90?'Bauchhar 🌦️':'Toofan ⛈️';
$('wxGo').onclick=async()=>{
  const q=$('city').value.trim();
  if(!q){oops();return}
  $('wxOut').textContent='Dekh rahe hain...';
  try{
    const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q))).json();
    if(!g.results){$('wxOut').textContent='Shehar nahi mila.';oops();return}
    const p=g.results[0];
    const w=(await(await fetch('https://api.open-meteo.com/v1/forecast?current_weather=true&latitude='+p.latitude+'&longitude='+p.longitude)).json()).current_weather;
    $('wxOut').innerHTML='<div>'+esc(p.name)+'</div><div class="big">'+w.temperature+'°C</div><div class="row">Haal<b>'+wc(w.weathercode)+'</b></div><div class="row">Hawa<b>'+w.windspeed+' km/h</b></div>';
    ding();
  }catch(e){$('wxOut').textContent='Internet ya service ki dikkat, thodi der baad try karo.';oops()}
};

const today=new Date();let cy=today.getFullYear(),cm=today.getMonth(),sel='',ev={};
try{ev=JSON.parse(ls.get('ev','{}'))}catch(e){}
const MN=['Janvari','Farvari','March','April','May','June','July','August','Sitambar','October','November','December'];
function drawCal(){
  $('cTitle').textContent=MN[cm]+' '+cy;
  let h=['Ra','So','Ma','Bu','Gu','Shu','Sha'].map(d=>'<b>'+d+'</b>').join('');
  const f=new Date(cy,cm,1).getDay(),n=new Date(cy,cm+1,0).getDate();
  for(let i=0;i<f;i++)h+='<i></i>';
  for(let d=1;d<=n;d++){
    const k=cy+'-'+(cm+1)+'-'+d,t=d===today.getDate()&&cm===today.getMonth()&&cy===today.getFullYear();
    h+='<button data-k="'+k+'" class="'+(t?'today ':'')+(ev[k]?'has':'')+'">'+d+'</button>';
  }
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    beep(600,0.05);sel=b.dataset.k;$('evBox').hidden=false;
    $('evLbl').textContent=sel+' ka kaam ya yaad';$('evTxt').value=ev[sel]||'';
  });
}
$('prev').onclick=()=>{cm--;if(cm<0){cm=11;cy--}drawCal()};
$('next').onclick=()=>{cm++;if(cm>11){cm=0;cy++}drawCal()};
$('evSave').onclick=()=>{
  if(!sel)return;
  const v=$('evTxt').value.trim();
  if(v)ev[sel]=v;else delete ev[sel];
  ls.set('ev',JSON.stringify(ev));drawCal();ding();
};
drawCal();

const aud=$('aud');let songs=[],si=0;
function listSongs(){
  $('pl').innerHTML=songs.map((s,i)=>'<button class="it'+(i===si?' on':'')+'" data-i="'+i+'">'+esc(s.n)+'</button>').join('');
  $('pl').querySelectorAll('button').forEach(b=>b.onclick=()=>playAt(+b.dataset.i));
}
function playAt(i){si=i;aud.src=songs[i].u;aud.play().catch(()=>{});$('nowp').textContent='▶ '+songs[i].n;listSongs()}
$('mf').onchange=e=>{songs=[...e.target.files].map(f=>({n:f.name,u:URL.createObjectURL(f)}));if(songs.length)playAt(0)};
aud.onended=()=>{if(si+1<songs.length)playAt(si+1)};

$('vf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  $('vbox').innerHTML='<video controls playsinline style="width:100%;border-radius:10px" src="'+URL.createObjectURL(f)+'"></video>';
};
$('yt').onclick=()=>{
  const m=$('yu').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if(!m){oops();return}
  $('vbox').innerHTML='<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px" src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen></iframe>';
};
</script>
</body>
</html>
