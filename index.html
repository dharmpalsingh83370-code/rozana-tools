<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolWeb - Naitik Rathor</title><style>
:root{--b:#f4f6fb;--c:#fff;--t:#182033;--p:#694cff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Arial;transition:.2s}body.dark{--b:#101522;--c:#1d2433;--t:#fff}body.pink{--p:#e83e8c}body.blue{--p:#087cff}header{background:var(--p);color:white;text-align:center;padding:18px;position:sticky;top:0;z-index:5}h1{margin:0}header p{margin:5px}#set{position:absolute;right:12px;top:12px;width:auto;background:#ffffff33}.grid{max-width:900px;margin:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.box{background:var(--c);padding:14px;border-radius:15px;box-shadow:0 3px 15px #0002}.box h2{font-size:18px;margin:0 0 8px}input,select,textarea,button{width:100%;padding:10px;margin:4px 0;border:1px solid #ccd2df;border-radius:9px;font:inherit}button{background:var(--p);color:white;border:0;font-weight:bold}.out{padding:8px;background:#0000000b;border-radius:8px;min-height:22px}.clock{text-align:center;font-size:28px;font-weight:bold}.emoji{position:fixed;bottom:20px;left:20px;font-size:32px;animation:b 1s infinite;z-index:9}@keyframes b{50%{transform:translateY(-20px)}}.hide{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modal>div{background:var(--c);padding:20px;border-radius:17px;width:min(400px,100%)}footer{text-align:center;padding:20px;color:#777}a{color:var(--p)}
</style></head><body>
<header><h1>🛠️ ToolWeb</h1><p id="wel">Welcome 👋</p><button id="set">⚙️</button></header>
<meta name="google-site-verification" content="0gVLu9IBUvchmsz1piHSIJShxAIIYFTO38y4iMessU0" />
<main class="grid">

<div class="box"><h2>🕐 Clock</h2><div id="clock" class="clock"></div><small id="date"></small></div>

<div class="box"><h2>🧮 Calculator</h2><input id="cal" placeholder="25*4+10"><button onclick="calc()">Calculate</button><div id="co" class="out"></div></div>

<div class="box"><h2>🎂 Age Calculator</h2><input id="dob" type="date"><button onclick="age()">Find Age</button><div id="ao" class="out"></div></div>

<div class="box"><h2>🔤 Word Counter</h2><textarea id="txt" oninput="words()" placeholder="Type text..."></textarea><div id="wo" class="out">0 words • 0 characters</div></div>

<div class="box"><h2>📝 Notes</h2><textarea id="note"></textarea><button onclick="saveNote()">Save Notes</button><button onclick="print()">🖨️ Print</button><div id="no" class="out"></div></div>

<div class="box"><h2>⏱️ Timer</h2><input id="tm" type="number" placeholder="Minutes"><button onclick="start()">Start</button><button onclick="stop()">Stop</button><div id="timer" class="clock">00:00</div></div>
